services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: emor
      POSTGRES_PASSWORD: emor
      POSTGRES_DB: emor_ecommerce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emor -d emor_ecommerce"]
      interval: 2s
      timeout: 5s
      retries: 20
